name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  APP_ID: io.github.zbcoding.Gifkino
  # GNOME 50 gives GTK 4.20, well above the 4.14 the bindings are gated at. The
  # extension branch has to match the runtime's freedesktop base.
  RUNTIME_VERSION: '50'
  RUST_EXT_VERSION: '25.08'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install GTK development packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libadwaita-1-dev ffmpeg gifsicle
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo fmt --check
    # No clippy gate: the tree has one explicit_counter_loop warning in
    # core/ops.rs. Fix that and add `cargo clippy --all-targets -- -D warnings`.
    # The video tests generate clips with lavfi and skip themselves when ffmpeg
    # is missing, which is why it is installed above.
    - run: cargo test

  appimage:
    # Cargo.toml gates the bindings at GTK 4.14 / libadwaita 1.5, which is what
    # noble ships. Building here puts the glibc floor at 2.39, so the image runs
    # on Ubuntu 24.04 and everything newer. A later runner would raise that floor
    # and buy nothing.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1   # the runners have no FUSE
    steps:
    - uses: actions/checkout@v4
    - name: Install GTK runtime, helper programs and packaging dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libadwaita-1-dev \
          gsettings-desktop-schemas adwaita-icon-theme librsvg2-common \
          librsvg2-bin webp-pixbuf-loader libgdk-pixbuf-2.0-0 \
          libgdk-pixbuf2.0-bin ffmpeg gifsicle xvfb
    - uses: dtolnay/rust-toolchain@stable
    - name: Build AppImage
      run: scripts/build-appimage.sh

    # The image builds even when the bundle is broken; only running it catches a
    # missing library or a bad AppRun.
    - name: Smoke-test the AppImage
      run: |
        ./Gifkino-x86_64.AppImage --appimage-extract >/dev/null
        squashfs-root/usr/bin/ffmpeg -version | head -1
        test -f squashfs-root/usr/share/gifkino/po/de.po
        set +e
        xvfb-run --auto-servernum timeout 25 ./Gifkino-x86_64.AppImage
        code=$?
        set -e
        case $code in
          124) echo "stayed up until the timeout" ;;
          0)   echo "exited cleanly" ;;
          *)   echo "::error::AppImage exited $code on startup"; exit 1 ;;
        esac
    - uses: actions/upload-artifact@v4
      with:
        name: Gifkino-x86_64.AppImage
        path: Gifkino-x86_64.AppImage
        if-no-files-found: error

  flatpak:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install flatpak-builder
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        flatpak remote-add --user --if-not-exists flathub \
          https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y --noninteractive flathub \
          org.gnome.Platform//${RUNTIME_VERSION} \
          org.gnome.Sdk//${RUNTIME_VERSION} \
          org.freedesktop.Sdk.Extension.rust-stable//${RUST_EXT_VERSION}
    # ffmpeg is a ten-minute compile that changes only when the manifest pins a
    # new tarball, so the module cache is worth carrying between runs.
    - uses: actions/cache@v4
      with:
        path: .flatpak-builder
        key: flatpak-builder-${{ hashFiles('io.github.zbcoding.Gifkino.yml') }}
        restore-keys: flatpak-builder-
    - name: Build
      run: |
        flatpak-builder --user --repo=repo --force-clean \
          build-dir "$APP_ID.yml"
        flatpak build-bundle repo "Gifkino.flatpak" "$APP_ID" \
          --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

    # No display needed for either of these, and both catch a bundle that built
    # but shipped nothing useful.
    - name: Check the bundled helpers and catalogs
      run: |
        flatpak install --user -y --noninteractive --bundle Gifkino.flatpak
        flatpak run --command=ffmpeg "$APP_ID" -version | head -1
        flatpak run --command=ffprobe "$APP_ID" -version | head -1
        flatpak run --command=gifsicle "$APP_ID" --version | head -1
        flatpak run --command=ls "$APP_ID" /app/share/gifkino/po

    # The FlatPark asset. FlatPark is a signed flatpak remote whose packages are
    # all extra-data: it never rebuilds an app and never rehosts one, so it
    # cannot consume Gifkino.flatpak (a bundle is a repo commit, installable
    # only by `flatpak install --bundle`) and it should not be handed the
    # AppImage either — that image carries a whole second GTK stack built on
    # noble, which inside a GNOME runtime is both redundant and a source of
    # version skew against this bundle.
    #
    # So publish what the bundle is made of: the /app tree from this very
    # build, one tarball, same bytes. FlatPark stages it under /app/extra and
    # runs it against org.gnome.Platform//50 — the same runtime this job built
    # against — so both channels ship one lineage: one binary, one ffmpeg, one
    # gifsicle, one set of catalogs. The contract this asset promises is
    # documented in docs/release.md; the guard below is what keeps it true.
    - name: Pack the /app tree for FlatPark
      run: |
        tar -C build-dir/files --numeric-owner --owner=0 --group=0 \
          -cJf "Gifkino-flatpark-x86_64.tar.xz" .
        # Relocatable: FlatPark unpacks this at /app/extra/gifkino, not /app, so
        # its wrapper points GIFKINO_PO_DIR and PATH into the tree. Everything
        # the app needs must therefore be *in* the tree and found through those
        # two, which is what these paths are.
        for path in bin/gifkino bin/ffmpeg bin/ffprobe bin/gifsicle \
                    share/gifkino/po share/applications/$APP_ID.desktop; do
          test -e "build-dir/files/$path" \
            || { echo "::error::$path missing from the /app tree"; exit 1; }
        done
        bsdtar -tf "Gifkino-flatpark-x86_64.tar.xz" >/dev/null
        ls -l "Gifkino-flatpark-x86_64.tar.xz"
    - uses: actions/upload-artifact@v4
      with:
        name: Gifkino-flatpark-x86_64.tar.xz
        path: Gifkino-flatpark-x86_64.tar.xz
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: Gifkino.flatpak
        path: Gifkino.flatpak
        if-no-files-found: error

  release:
    needs: [appimage, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        merge-multiple: true
    # The asset list alone does not say which one a given machine can run, so
    # the notes say it instead.
    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cat > notes.md <<'EOF'
        ## Downloads

        - **Flatpak** (`Gifkino.flatpak`) — carries its own GTK and the ffmpeg,
          ffprobe and gifsicle programs the editor drives, so it runs anywhere
          flatpak does, Ubuntu 22.04 included. Install with
          `flatpak install --bundle Gifkino.flatpak`.
        - **AppImage** (`Gifkino-x86_64.AppImage`) — built against glibc 2.39,
          so it needs Ubuntu 24.04, Debian 13, Fedora 40 or newer. Bundles the
          same helper programs. `chmod +x` it and run it.

        Not a download — **`Gifkino-flatpark-x86_64.tar.xz`** is the `/app` tree
        out of the same build as `Gifkino.flatpak`, published for the
        [FlatPark](https://flatpark.org/apps/io.github.zbcoding.Gifkino) remote
        to stage as extra-data. It is not a standalone program: it expects
        `org.gnome.Platform//50` around it. Install from FlatPark instead:

        ```
        flatpak remote-add --if-not-exists flatpark https://dl.flatpark.org/flatpark.flatpakrepo
        flatpak install flatpark io.github.zbcoding.Gifkino
        ```
        EOF
        gh release create "${GITHUB_REF_NAME}" \
          --repo "${GITHUB_REPOSITORY}" \
          --title "${GITHUB_REF_NAME}" \
          --notes-file notes.md \
          Gifkino-x86_64.AppImage Gifkino.flatpak Gifkino-flatpark-x86_64.tar.xz
