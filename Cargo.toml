[package]
name = "gifkino"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cairo-rs = "0.22.0"
color_quant = "2.0.0"
gif = "0.14.2"
# GNOME 46 runtime baseline: FileDialog (4.10), Picture content-fit (4.8).
gtk4 = { version = "0.11.4", features = ["v4_14"] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "tiff",
    "tga",
    "ico",
    "qoi",
    "pnm",
    "webp",
] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
pangocairo = "0.22.8"
relm4 = { version = "0.11.0", features = ["libadwaita"] }
